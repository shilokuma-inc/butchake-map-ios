<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1500x760">
<meta name="mock-scale" content="2">
<title>比較シート — アプリアイコン</title>
<link rel="stylesheet" href="compare.css">
<style>
  .sheet { width: 1500px; height: 760px; }
  .grid { grid-template-columns: repeat(6, 213px); }
  .icon-big { width: 134px; height: 134px; border-radius: 30px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); display: block; }
  .icon-row { display: flex; align-items: flex-end; gap: 14px; }
  .icon-small { width: 60px; height: 60px; border-radius: 13.4px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); display: block; }
  .no-image { display: flex; align-items: center; justify-content: center; background: #EEEEEE; color: #8E8E93; font-size: 18px; }
  .no-image.icon-small { font-size: 9px; }
</style>
</head>
<body>
<div class="sheet"><h1>アプリアイコンの一覧</h1><p class="lead">各案の icon.svg（1024x1024 で描き、角丸はここで見え方の確認としてかけています）。左が大きな見え方、右がホーム画面の大きさ（60pt 相当）。</p>
<div class="grid" id="grid"></div></div>
<script src="designs.js"></script>
<script>
  // 今のアプリのアイコンは仮の「No Image」なので、同じ見た目の枠で示す
  document.getElementById('grid').innerHTML = window.DESIGNS.map(d => {
    const big = d.id === 'current' ? '<span class="icon-big no-image">No Image</span>' : `<img class="icon-big" src="../mocks/${d.id}/icon.svg" alt="${d.name}">`;
    const small = d.id === 'current' ? '<span class="icon-small no-image">No Image</span>' : `<img class="icon-small" src="../mocks/${d.id}/icon.svg" alt="">`;
    return `<div class="cell"><div class="icon-row">${big}${small}</div>
      <p class="cap"><span class="id ${d.dir === 'A' ? 'a' : d.dir === 'B' ? 'b' : ''}">${d.id}</span><strong>${d.name}</strong></p></div>`;
  }).join('');
</script>
</body>
</html>
