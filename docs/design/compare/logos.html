<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1500x1120">
<meta name="mock-scale" content="2">
<title>比較シート — ロゴ</title>
<link rel="stylesheet" href="compare.css">
<style>
  .sheet { width: 1500px; height: 1120px; }
  .grid { grid-template-columns: repeat(3, 440px); gap: 24px 22px; }
  /* 各案の home.html の上の方（ナビゲーションのロゴ）だけを切り出す */
  .frame-clip { width: 440px; height: 168px; border-radius: 14px; }
  .frame-clip iframe { width: 402px; height: 874px; transform: translateY(-62px) scale(1.09); transform-origin: 0 62px; }
</style>
</head>
<body>
<div class="sheet"><h1>ロゴの一覧（ナビゲーションに置いたとき）</h1><p class="lead">各案のホームの上の部分を切り出したもの。ロゴの大きな見え方は各案のブランドシートにあります。</p>
<div class="grid" id="grid"></div></div>
<script src="designs.js"></script>
<script>
  document.getElementById('grid').innerHTML = window.DESIGNS.map(d => `<div class="cell">
    <div class="frame-clip"><iframe src="../mocks/${d.id}/home.html" title="${d.name}" scrolling="no"></iframe></div>
    <p class="cap"><span class="id ${d.dir === 'A' ? 'a' : d.dir === 'B' ? 'b' : ''}">${d.id}</span><strong>${d.name}</strong></p></div>`).join('');
  window.mockReady = window.waitForFrames();
</script>
</body>
</html>
