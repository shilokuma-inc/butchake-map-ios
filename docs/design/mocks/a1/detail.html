<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-1 王道ポップ — 投稿詳細</title>
<meta name="mock-fonts" content="Mochiy Pop One|M PLUS Rounded 1c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 22px; padding: 10px 16px 0; }
  .detail-head { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 24px 16px 16px;
    border: var(--line); border-radius: 24px; background: var(--yellow); box-shadow: var(--pop-shadow); }
  .detail-title { font-family: var(--font-heading); font-size: 24px; font-weight: 400; line-height: 1.35; }
  .detail-area { display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 800; }
  .detail-head .badge-author { background: #FFFFFF; }
  .detail-meta { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 2.5px dashed var(--ink); }
  .avatar { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; border: var(--line);
    border-radius: 50%; background: var(--orange); font-family: var(--font-heading); font-size: 17px; }
  .detail-author { flex: 1; }
  .detail-author strong { display: block; font-size: 15px; font-weight: 800; }
  .detail-author span { font-size: 13px; font-weight: 700; color: var(--color-text-secondary); }
  .react { display: inline-flex; align-items: center; gap: 4px; padding: 6px 10px; border: 2.5px solid var(--ink); border-radius: 999px;
    background: #FFFFFF; box-shadow: 2px 2px 0 var(--ink); font-size: 15px; font-weight: 800; }
  .react.like .icon { color: var(--pink); }
  .spot-card { display: flex; flex-direction: column; gap: 16px; padding-top: 22px; }
  .rank-ribbon { position: absolute; top: -16px; left: 14px; display: inline-flex; align-items: baseline; gap: 2px; padding: 4px 14px;
    border: var(--line); border-radius: 14px; background: var(--ink); color: var(--yellow); font-family: var(--font-heading);
    font-size: 26px; line-height: 1.1; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--orange); }
  .rank-ribbon small { font-size: 14px; }
  .spot-photo { display: flex; align-items: center; justify-content: center; height: 132px; border: var(--line); border-radius: 18px;
    background: repeating-linear-gradient(-45deg, #FFB43A 0 14px, var(--orange) 14px 28px); color: var(--ink); }
  .spot-photo .icon-wrap { display: inline-flex; padding: 14px; border: var(--line); border-radius: 50%; background: #FFFFFF; }
  .spot-name { font-family: var(--font-heading); font-size: 19px; line-height: 1.35; }
  .spot-address { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--color-text-secondary); }
  .bubble { margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 投稿詳細: 黄色の見出しの札・作者といいね／スター・順位のリボンを付けたスポットのカード・吹き出しのぶっちゃけコメント
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const spotCard = spot => `<article class="card spot-card">
    <span class="rank-ribbon">${spot.order}<small>位</small></span>
    <div class="spot-photo"><span class="icon-wrap">${icon(category.icon, { size: 36 })}</span></div>
    <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${icon('mappin', { size: 14 })}${esc(spot.address)}</p></div>
    ${parts.commentBubble(spot.recommendation)}
    <span class="pop-button secondary" style="align-self:flex-start">${icon('map', { size: 18 })}${esc(data.strings.openInMaps)}</span>
  </article>`;
  Mock.mount(Mock.screen({
    nav: { title: '', back: true, trailing: ['share'] },
    body: `<div class="detail">
      <div class="detail-head">
        <span class="sticker card-sticker" style="background:var(--orange)">マイ三大</span>
        <h1 class="detail-title">${esc(post.title)}</h1>
        <p class="detail-area">${icon('mappin', { size: 16 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div class="detail-meta"><span class="avatar">金</span>
          <div class="detail-author"><strong>${esc(post.authorName)}</strong><span>${esc(post.date)}</span></div>
          <span class="react like">${icon('heartFill', { size: 18 })}${post.likeCount}</span>
          <span class="react">${icon('star', { size: 18 })}${post.starCount}</span></div>
      </div>
      ${post.spots.slice(0, 2).map(spotCard).join('')}
    </div>`,
  }));
</script>
</body>
</html>
