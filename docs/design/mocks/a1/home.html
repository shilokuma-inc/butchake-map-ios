<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-1 王道ポップ — ホーム</title>
<meta name="mock-fonts" content="Mochiy Pop One|M PLUS Rounded 1c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 6px 18px 4px; }
  .greeting { display: flex; align-items: center; gap: 10px; margin: 6px 16px 0; }
  .greeting .bubble { flex: 1; padding: 8px 12px; font-size: 15px; font-weight: 800; }
  .greeting .bubble::after { left: -11px; top: 12px; transform: rotate(-45deg); }
  .greeting-face { flex: none; display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center;
    border: var(--line); border-radius: 50%; background: var(--orange); }
  .home { display: flex; flex-direction: column; gap: 22px; padding-top: 18px; }
  .home section { display: flex; flex-direction: column; gap: 14px; }
  .carousel { padding: 16px 16px 8px; margin-top: -10px; }
  .feed { display: flex; flex-direction: column; gap: 18px; padding: 4px 16px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: ロゴのステッカー・あいさつの吹き出し・今週のぶっちゃけ／急上昇のカルーセル・新着の投稿のフィード
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  const face = `<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="10" cy="12" r="2.6" fill="#1C1A17"/>
    <circle cx="20" cy="12" r="2.6" fill="#1C1A17"/><path d="M8 18 q7 7 14 0" fill="none" stroke="#1C1A17" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(34), trailing: [] },
    tab: 'home',
    body: `<div class="greeting"><span class="greeting-face">${face}</span><p class="bubble">今日はどこの本音、のぞいちゃう？</p></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks, '毎週更新')}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'アツい！')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts)}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
