<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-1 王道ポップ — マップ</title>
<meta name="mock-fonts" content="Mochiy Pop One|M PLUS Rounded 1c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .map-screen .screen-scroll { z-index: 1; pointer-events: none; }
  .map-screen .status-bar { background: var(--cream); }
  .map-screen .nav-bar { background: var(--cream); border-bottom: var(--line); }
  .map-screen .nav-inline-title { font-family: var(--font-heading); font-weight: 400; font-size: 19px; }
  .map-illustration { top: 100px; }
  .map-illustration svg.bounce-marks { inset: auto; z-index: 3; width: 60px; height: 30px; margin: -100px 0 0 -30px; }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; padding: 10px 16px 34px; z-index: 5;
    border-top: var(--line); border-radius: 30px 30px 0 0; background: var(--cream); box-shadow: 0 -4px 0 var(--ink);
    display: flex; flex-direction: column; gap: 12px; }
  .grabber { align-self: center; width: 44px; height: 6px; border-radius: 3px; background: var(--ink); }
  .sheet-title { font-family: var(--font-heading); font-size: 20px; font-weight: 400; line-height: 1.35; }
  .sheet-area { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 14px; font-weight: 800; color: var(--color-text-secondary); }
  .spot-line { display: flex; align-items: flex-start; gap: 10px; }
  .spot-name { font-size: 17px; font-weight: 800; }
  .spot-address { font-size: 13px; font-weight: 700; color: var(--color-text-secondary); }
  .sheet-card { display: flex; flex-direction: column; gap: 14px; padding: 14px; }
  .sheet-card .bubble { padding: 8px 12px; }
  .sheet-card .bubble-text { font-size: 15px; }
  .sheet-actions { display: flex; align-items: center; gap: 16px; padding: 0 4px; }
  .sheet-actions .pop-button { margin-left: auto; }
  .like-button .icon { color: var(--pink); }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // マップ: イラストの地図に吹き出しの形のピン（選んだピンは跳ねる）と、ピンを選んだときのハーフシート
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const spot = post.spots[1];
  const pins = post.spots.map(s => ({ order: s.order, x: s.mapPosition.x, y: s.mapPosition.y * 0.5 + 8, selected: s === spot }));
  const selected = pins.find(p => p.selected);
  // 選んだピンが跳ねたことを示す、ピンの上の 3 本の線
  const marks = `<svg class="bounce-marks" style="left:${selected.x}%;top:${selected.y}%" viewBox="0 0 60 30" aria-hidden="true">
    <path d="M8 26 L2 12 M30 20 V2 M52 26 L58 12" stroke="#1C1A17" stroke-width="4" stroke-linecap="round"/></svg>`;
  const shadows = pins.map(p => `<span class="map-pin-shadow" style="left:${p.x}%;top:${p.y}%"></span>`).join('');
  Mock.mount(Mock.screen({
    className: 'map-screen',
    nav: { title: 'マップ' },
    overlay: `${Mock.mapIllustration(pins).replace('<span class="map-pin', `${shadows}${marks}<span class="map-pin`)}
      <section class="sheet-panel">
        <span class="grabber"></span>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div><h2 class="sheet-title">${esc(post.title)}</h2>
          <p class="sheet-area">${icon('mappin', { size: 14 })}${esc(post.prefecture)} ${esc(post.city)}</p></div>
        <article class="card sheet-card"><div class="spot-line">${parts.rank(spot.order)}
          <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
          ${parts.commentBubble(spot.recommendation)}</article>
        <div class="sheet-actions">${parts.likeButton(post)}${parts.starButton(post)}
          <span class="pop-button">${esc(data.strings.viewPost)}${icon('chevronRight', { size: 16 })}</span></div>
      </section>`,
  }));
</script>
</body>
</html>
