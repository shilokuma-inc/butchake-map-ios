<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-2 マンガのツッコミ — 投稿詳細</title>
<meta name="mock-fonts" content="Reggae One|Yusei Magic|M PLUS 1p">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Yusei+Magic&family=M+PLUS+1p:wght@500;700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 16px; padding: 4px 12px 0; }
  .head-panel { position: relative; padding: 16px 16px 14px; border: var(--panel); overflow: hidden;
    background: linear-gradient(transparent 55%, #FFFFFF 85%), radial-gradient(var(--ink) .9px, transparent 1.2px) 0 0 / 5px 5px; }
  .head-panel > * { position: relative; }
  .detail-title { display: inline; font-family: var(--font-heading); font-weight: 400; font-size: 25px; line-height: 1.45; background: #FFFFFF; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 4px; }
  .detail-area { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 0 4px; background: #FFFFFF; font-size: 15px; font-weight: 700; }
  .head-panel .badges { margin-top: 10px; }
  .detail-meta { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .face { flex: none; width: 42px; height: 42px; border: var(--panel); border-radius: 50%; background: #FFFFFF; }
  .detail-author { flex: 1; font-size: 15px; font-weight: 800; }
  .detail-author span { display: block; font-size: 13px; font-weight: 700; color: var(--color-text-secondary); }
  .spot-panel { position: relative; border: var(--panel); padding: 0 0 14px; }
  .spot-top { display: flex; align-items: stretch; border-bottom: var(--panel); }
  .rank-box { display: flex; align-items: center; justify-content: center; width: 70px; background: var(--ink); color: #FFFFFF; font-family: var(--font-heading); font-size: 30px; }
  .rank-box small { font-size: 14px; margin-left: 2px; }
  .photo { position: relative; flex: 1; height: 112px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .photo .icon-wrap { position: relative; display: inline-flex; padding: 12px; border: var(--panel); border-radius: 50%; background: #FFFFFF; }
  .photo .sfx { position: absolute; right: 10px; top: 8px; font-size: 22px; }
  .spot-text { padding: 12px 14px 0; display: flex; flex-direction: column; gap: 14px; }
  .spot-name { font-family: var(--font-heading); font-size: 20px; line-height: 1.35; }
  .spot-address { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--color-text-secondary); }
  .talk { display: flex; align-items: flex-end; gap: 6px; }
  .talk .face { width: 36px; height: 36px; }
  .talk .balloon { flex: 1; text-align: left; border-radius: 24px; padding: 10px 14px; }
  .talk .balloon::before { left: -14px; bottom: 10px; border: 8px solid transparent; border-right: 16px solid var(--ink); border-left: 0; transform: none; }
  .talk .balloon::after { left: -9px; bottom: 12px; border: 6px solid transparent; border-right: 12px solid #FFFFFF; border-left: 0; transform: none; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 投稿詳細: 網点のコマにタイトル・作者の顔の丸と、いいね／スター。スポットはコマ割り（順位の黒いコマ・集中線の写真の枠）と、作者がしゃべるフキダシのコメント
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const face = `<svg class="face" viewBox="0 0 42 42" aria-hidden="true"><circle cx="15" cy="18" r="2.4" fill="#111"/><circle cx="27" cy="18" r="2.4" fill="#111"/>
    <path d="M13 26 q8 7 16 0" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"/><path d="M30 10 l4 -4 M33 13 l5 -2" stroke="#C8102E" stroke-width="2" stroke-linecap="round"/></svg>`;
  const sfx = ['', 'ドン!', 'ジャーン', 'キラッ'];
  const spot = s => `<article class="spot-panel">
    <div class="spot-top"><span class="rank-box">${s.order}<small>位</small></span>
      <div class="photo"><span class="speed-lines" style="opacity:.55"></span><span class="icon-wrap">${icon(category.icon, { size: 32 })}</span><span class="sfx">${sfx[s.order]}</span></div></div>
    <div class="spot-text">
      <div><p class="spot-name">${esc(s.name)}</p><p class="spot-address">${icon('mappin', { size: 14 })}${esc(s.address)}</p></div>
      <div class="talk">${face}${parts.balloon(s.recommendation)}</div>
      <span class="manga-button secondary" style="align-self:flex-start"><span style="display:inline-flex;gap:6px;align-items:center">${icon('map', { size: 17 })}${esc(data.strings.openInMaps)}</span></span>
    </div></article>`;
  Mock.mount(Mock.screen({
    nav: { title: '', back: true, trailing: ['share'] },
    body: `<div class="detail">
      <header class="head-panel">
        <h1 class="detail-title">${esc(post.title)}</h1><br>
        <p class="detail-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div class="detail-meta">${face}<p class="detail-author">${esc(post.authorName)}<span>${esc(post.date)}</span></p>
          ${parts.likeButton(post)}${parts.starButton(post)}</div>
      </header>
      ${post.spots.slice(0, 2).map(spot).join('')}
    </div>`,
  }));
</script>
</body>
</html>
