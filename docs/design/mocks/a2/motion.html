<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>A-2 マンガのツッコミ — 動きのコマ割り</title>
<meta name="mock-fonts" content="Reggae One|Yusei Magic|M PLUS 1p">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Yusei+Magic&family=M+PLUS+1p:wght@500;700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: #FFFFFF; }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 14px; margin-top: 36px; }
  .motion-note h2 { display: inline-block; padding: 2px 12px; background: var(--ink); color: #FFFFFF; font-family: var(--font-heading); font-weight: 400; font-size: 22px; transform: skewX(-8deg); }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { font-weight: 800; white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; border: var(--panel); display: flex; align-items: center; justify-content: center; }
  .frame:nth-child(odd) .frame-box { transform: skewX(-1.5deg); }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 800; }
  .frame-cap .time { padding: 1px 8px; background: var(--red); color: #FFFFFF; font-family: var(--font-number); font-size: 13px; }
  .tap { position: absolute; width: 46px; height: 46px; border: 2.5px dashed var(--ink); border-radius: 50%; }
  .like-big { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: var(--panel); background: #FFFFFF; font-size: 22px; font-weight: 800; }
  .like-big.on .icon { color: var(--red); }
  .frame .sfx { position: absolute; z-index: 2; font-size: 26px; }
  .mini-card { position: relative; width: 210px; padding: 12px; border: var(--panel); background: #FFFFFF; font-size: 14px; font-weight: 800; line-height: 1.4; }
  .mini-detail { position: absolute; inset: 0; background: #FFFFFF; padding: 18px 14px; display: flex; flex-direction: column; gap: 10px; }
  .mini-detail h3 { font-family: var(--font-heading); font-weight: 400; font-size: 18px; line-height: 1.35; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon, parts } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  const like = (on, count, scale = 1) => `<span class="like-big${on ? ' on' : ''}" style="transform:scale(${scale})">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const lines = (opacity = 0.9) => `<span class="speed-lines" style="opacity:${opacity}"></span>`;
  const card = (style = '') => `<div class="mini-card" style="${style}">旅好きが推す横浜の三大夕景スポット<br><span style="font-weight:700;color:#555">神奈川県 横浜市</span></div>`;
  const detail = (style = '') => `<div class="mini-detail" style="${style}"><h3>旅好きが推す横浜の三大夕景スポット</h3>
    <div class="badges">${parts.categoryBadge({ category: 'scenery' })}${parts.authorBadge({ authorType: 'traveler' })}</div>
    <div style="display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px">${parts.rank(1)}大さん橋 屋上の芝生デッキ</div></div>`;

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(44)}<p>A-2「マンガのツッコミ」の動き。集中線・効果音・コマ送りで、マンガの 1 コマのように見せる。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、集中線・拡大・コマの移動をやめてフェードだけにする。点滅はしない（集中線も明滅させない）。</p></div>

    <div class="motion">
      ${note('いいね（ドキッ）', [['時間', '0.5 秒'], ['イージング', 'spring（response 0.3・damping 0.6）で 1.25 倍。集中線は easeOut 0.25 秒で広がって消える'], ['ハプティクス', '2 コマ目で impact（rigid）'], ['Reduce Motion', '集中線・効果音・拡大をやめ、ハートの塗りを 0.15 秒でクロスフェード']])}
      ${frame('0.00', '押す', `${like(false, 128, 0.94)}<span class="tap" style="left:72px;top:126px"></span>`)}
      ${frame('0.10', '集中線とドキッ!', `${lines()}${like(true, 129, 1.25)}<span class="sfx" style="right:16px;top:30px">ドキッ!</span>`)}
      ${frame('0.25', '戻りながら線が消える', `${lines(0.35)}${like(true, 129, 1.05)}`)}
      ${frame('0.50', '落ち着く', like(true, 129))}
    </div>

    <div class="motion">
      ${note('投稿の公開（ババーン）', [['時間', '1.2 秒'], ['イージング', '見開きのコマが easeOut 0.3 秒で斜めに入り、叫びのフキダシが spring（damping 0.55）で 1.3 倍から。最後はコマが easeIn で縮んでホームのカードになる'], ['ハプティクス', '2 コマ目で notification（success）'], ['Reduce Motion', 'コマの移動・集中線・拡大をやめ、フキダシを 0.2 秒でフェードイン。ホームのカードもフェードで出す']])}
      ${frame('0.00', '「公開する」を押す', '<span class="manga-button red" style="font-size:18px;padding:14px 24px"><span>公開する</span></span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.30', '見開きのコマに叫び', `${lines()}<span class="shout-wrap" style="transform:rotate(-6deg) scale(1.1)"><span class="shout" style="font-family:var(--font-heading);font-size:26px">公開!!</span></span>`)}
      ${frame('0.60', 'ババーン', `${lines(0.6)}<span class="shout-wrap" style="transform:rotate(-6deg)"><span class="shout" style="font-family:var(--font-heading);font-size:22px">公開!!</span></span><span class="sfx" style="left:14px;bottom:30px">ババーン</span>`)}
      ${frame('1.20', 'ホームの先頭に並ぶ', `<div style="display:flex;flex-direction:column;align-items:center;gap:22px">${parts.balloon('みんなに届いた！', '')}${card()}</div><span class="sfx" style="left:14px;bottom:24px;font-size:20px">NEW!</span>`)}
    </div>

    <div class="motion">
      ${note('画面遷移（コマ送り）', [['時間', '0.4 秒'], ['イージング', '押したカードが 1.04 倍に寄り、次のコマ（投稿詳細）が右から斜めの境目で入る（easeInOut 0.3 秒）'], ['ハプティクス', 'なし'], ['Reduce Motion', '寄り・斜めの境目をやめ、0.2 秒のクロスフェード']])}
      ${frame('0.00', 'カードを押す', `${card()}<span class="tap" style="left:120px;top:140px"></span>`)}
      ${frame('0.10', 'カードに寄る', card('transform:scale(1.04) rotate(-1deg)'))}
      ${frame('0.25', '斜めの境目で次のコマ', `${card('transform:scale(1.04) rotate(-1deg)')}${detail('clip-path:polygon(55% 0, 100% 0, 100% 100%, 35% 100%);border-left:3px solid #111')}`)}
      ${frame('0.40', '投稿詳細', detail())}
    </div>
  </div>`);
</script>
</body>
</html>
