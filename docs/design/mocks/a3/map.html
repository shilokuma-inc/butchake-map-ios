<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-3 駄菓子屋のおまけシール — マップ</title>
<meta name="mock-fonts" content="Hachi Maru Pop|Zen Maru Gothic">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700;900&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .map-screen .screen-scroll { z-index: 1; pointer-events: none; }
  .map-screen .status-bar, .map-screen .nav-bar { background: #FFFFFF; }
  .map-screen .nav-inline-title { font-family: var(--font-heading); font-weight: 400; font-size: 20px; }
  .map-illustration { top: 106px; }
  .map-illustration .map-pin { z-index: 3; }
  .map-deco { position: absolute; z-index: 2; }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; padding: 10px 16px 34px; z-index: 5;
    border-radius: 28px 28px 0 0; background: #FFFFFF; box-shadow: 0 -4px 18px rgba(122, 40, 90, .2); display: flex; flex-direction: column; gap: 12px; }
  .grabber { align-self: center; width: 44px; height: 6px; border-radius: 3px; background: var(--holo); box-shadow: 0 0 0 1px #F3D3E4; }
  .sheet-title { font-family: var(--font-body); font-size: 20px; font-weight: 900; line-height: 1.35; }
  .sheet-area { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 15px; color: var(--color-text-secondary); }
  .spot-line { display: flex; align-items: center; gap: 10px; }
  .spot-name { font-size: 17px; font-weight: 900; }
  .spot-address { margin-top: 2px; font-size: 14px; color: var(--color-text-secondary); }
  .memo-text { font-size: 15px; }
  .sheet-actions { display: flex; align-items: center; gap: 16px; margin-top: auto; }
  .sheet-actions .candy-button { margin-left: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // マップ: 淡い色の地図に、丸いシールのピン。選んだピンはキラキラのシールで少し傾き、まわりに星
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const spot = post.spots[1];
  const pins = post.spots.map(s => ({ order: s.order, x: s.mapPosition.x, y: s.mapPosition.y * 0.5 + 6, selected: s === spot }));
  const sel = pins.find(p => p.selected);
  const stars = `${Mock.sparkle(`left:calc(${sel.x}% + 30px);top:calc(${sel.y}% - 40px);width:20px;height:20px;z-index:4`)}
    ${Mock.sparkle(`left:calc(${sel.x}% - 44px);top:calc(${sel.y}% - 30px);z-index:4`, '#FF5FA2')}
    ${Mock.sparkle(`left:calc(${sel.x}% + 34px);top:calc(${sel.y}% + 14px);z-index:4`, '#5BD0F0')}`;
  Mock.mount(Mock.screen({
    className: 'map-screen',
    nav: { title: 'マップ' },
    overlay: `${Mock.mapIllustration(pins).replace('<span class="map-pin', `${stars}<span class="map-pin`)}
      <section class="sheet-panel">
        <span class="grabber"></span>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div><h2 class="sheet-title">${esc(post.title)}</h2>
          <p class="sheet-area">${icon('mappin', { size: 14 })}${esc(post.prefecture)} ${esc(post.city)}</p></div>
        <div class="spot-line">${parts.rank(spot.order)}
          <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
        ${parts.memo(spot.recommendation)}
        <div class="sheet-actions">${parts.likeButton(post)}${parts.starButton(post)}
          <span class="candy-button">${esc(data.strings.viewPost)}${icon('chevronRight', { size: 16 })}</span></div>
      </section>`,
  }));
</script>
</body>
</html>
