<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>A-3 駄菓子屋のおまけシール — 動きのコマ割り</title>
<meta name="mock-fonts" content="Hachi Maru Pop|Zen Maru Gothic">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700;900&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: var(--color-bg); }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 18px; margin-top: 36px; }
  .motion-note h2 { display: inline-block; padding: 2px 16px; border-radius: 999px; background: var(--holo); font-family: var(--font-heading); font-weight: 400; font-size: 18px; white-space: nowrap;
    box-shadow: 0 0 0 3px #FFFFFF, 0 2px 6px 3px rgba(122, 40, 90, .15); }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { font-weight: 900; color: var(--pink-deep); white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; border-radius: 24px; background: #FFFFFF; box-shadow: var(--shadow-card);
    display: flex; align-items: center; justify-content: center; }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 700; }
  .frame-cap .time { padding: 1px 10px; border-radius: 999px; background: var(--pink-deep); color: #FFFFFF; font-size: 13px; }
  .tap { position: absolute; width: 46px; height: 46px; border: 2.5px dashed var(--pink-deep); border-radius: 50%; }
  .like-big { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; background: #FFFFFF; font-size: 22px; font-weight: 900;
    box-shadow: 0 0 0 4px #FFFFFF, 0 3px 10px 4px rgba(122, 40, 90, .18); }
  .like-big.on { color: var(--pink-deep); }
  .peel { position: absolute; }
  .pack { position: relative; width: 120px; height: 150px; border-radius: 12px; background: var(--pink); box-shadow: 0 0 0 4px #FFFFFF, 0 3px 10px 4px rgba(122, 40, 90, .2);
    display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-size: 40px; }
  .pack-top { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-radius: 12px 12px 0 0; background: #FF8BBE; }
  .card-mini { width: 210px; padding: 14px; border-radius: 20px; background: #FFFFFF; box-shadow: var(--shadow-card); font-size: 14px; font-weight: 700; line-height: 1.4; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  const like = (on, count, scale = 1) => `<span class="like-big${on ? ' on' : ''}" style="transform:scale(${scale})">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const s = Mock.sparkle;
  const stars = n => [
    s('left:60px;top:70px;width:22px;height:22px'), s('right:56px;top:80px', '#FF5FA2'), s('left:80px;bottom:80px', '#5BD0F0'),
    s('right:70px;bottom:70px;width:20px;height:20px'),
  ].slice(0, n).join('');
  const card = (extra = '') => `<div class="card-mini" style="padding-top:22px;${extra}">旅好きが推す横浜の三大夕景スポット<br><span style="font-weight:500;color:#6E4F73">神奈川県 横浜市</span></div>`;

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(40)}<p>A-3「駄菓子屋のおまけシール」の動き。ハートのシールが弾む・おまけの袋を開ける・カードをシールのように貼る。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、拡大・回転・キラキラの移動をやめてフェードだけにする。キラキラは明滅させない（光が流れるのは 1 回だけ）。</p></div>

    <div class="motion">
      ${note('いいね（ハートのシール）', [['時間', '0.5 秒'], ['イージング', 'spring（response 0.3・damping 0.65）で 1.2 倍。星が 4 つ easeOut 0.3 秒で外へ散って消える'], ['ハプティクス', '2 コマ目で impact（soft）'], ['Reduce Motion', '拡大と星をやめ、ハートの塗りと件数の色を 0.15 秒でクロスフェード']])}
      ${frame('0.00', '押す', `${like(false, 128, 0.95)}<span class="tap" style="left:60px;top:126px"></span>`)}
      ${frame('0.12', 'ハートがシールになって弾む', `${stars(4)}${like(true, 129, 1.2)}`)}
      ${frame('0.30', '星が外へ散る', `${stars(2)}${like(true, 129, 1.04)}`)}
      ${frame('0.50', '落ち着く', like(true, 129))}
    </div>

    <div class="motion">
      ${note('投稿の公開（おまけの袋を開ける）', [['時間', '1.4 秒'], ['イージング', '袋の上が easeOut 0.25 秒でちぎれ、キラキラのシールが spring（damping 0.6）で飛び出す。シールの上を光が左から右へ 1 回だけ流れる（0.5 秒）'], ['ハプティクス', '袋が開いたときに impact（light）、シールが出たら notification（success）'], ['Reduce Motion', '袋・飛び出し・光の流れをやめ、「公開しました」のシールを 0.2 秒でフェードイン']])}
      ${frame('0.00', '「公開する」を押す', '<span class="candy-button" style="font-size:18px;padding:14px 26px">公開する</span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.25', '袋の上がちぎれる', '<div class="pack"><span class="pack-top" style="transform:translate(16px,-26px) rotate(14deg)"></span>?</div>')}
      ${frame('0.60', 'キラキラのシールが出る', `${stars(4)}<span class="sticker holo" style="font-size:22px;padding:12px 22px;transform:rotate(-6deg) scale(1.1)">公開しました！</span>`)}
      ${frame('1.40', 'ホームの先頭に貼られる', `${card()}<span class="sticker" style="position:absolute;right:30px;top:96px;--c:#FFE14D;transform:rotate(8deg)">NEW</span>`)}
    </div>

    <div class="motion">
      ${note('カードの出現（シールを貼る）', [['時間', '0.45 秒（1 まいずつ 0.08 秒ずらす）'], ['イージング', '1.08 倍・-6° から spring（response 0.35・damping 0.7）で 1 倍・0° に。白いフチの影が近づく'], ['ハプティクス', 'なし（スクロールのたびに震えないよう）'], ['Reduce Motion', '拡大・回転をやめ、0.2 秒でフェードイン']])}
      ${frame('0.00', '空いた場所', '<div class="card-mini" style="background:transparent;box-shadow:none;border:2.5px dashed #E7A9C8;color:transparent">.<br>.</div>')}
      ${frame('0.10', '少し浮いて傾いたシール', card('transform:scale(1.08) rotate(-6deg);box-shadow:0 0 0 5px #FFFFFF, 0 14px 20px 6px rgba(122, 40, 90, .2)'))}
      ${frame('0.25', 'ペタッと近づく', card('transform:scale(1.02) rotate(-1deg)'))}
      ${frame('0.45', '貼れた', card())}
    </div>
  </div>`);
</script>
</body>
</html>
