<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-4 ネオブルータリズム — 投稿詳細</title>
<meta name="mock-fonts" content="Dela Gothic One|Murecho">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Murecho:wght@500;700;800;900&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 22px; padding: 6px 16px 0; }
  .head { border: var(--border); background: var(--yellow); box-shadow: var(--shadow); }
  .head-top { padding: 14px 14px 12px; }
  .detail-title { font-family: var(--font-heading); font-weight: 400; font-size: 24px; line-height: 1.4; }
  .detail-area { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 15px; font-weight: 800; }
  .head .badges { margin-top: 10px; }
  .detail-meta { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-top: var(--border); background: #FFFFFF; }
  .detail-author { flex: 1; font-size: 15px; font-weight: 800; }
  .detail-author span { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
  .spot { display: flex; flex-direction: column; gap: 14px; padding: 14px; }
  .spot-head { display: flex; align-items: center; gap: 12px; }
  .spot-name { font-weight: 900; font-size: 19px; line-height: 1.35; }
  .spot-address { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 14px; color: var(--color-text-secondary); }
  .photo { display: flex; align-items: center; justify-content: center; height: 110px; border: var(--border); background: var(--blue); color: #FFFFFF; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 投稿詳細: 黄色のベタの見出しのブロック・白の作者の帯。スポットは大きな順位の数字と、青いベタの写真の枠、赤い札のコメントの箱
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const spot = s => `<article class="card spot">
    <div class="spot-head">${parts.bigRank(s.order)}<div><p class="spot-name">${esc(s.name)}</p><p class="spot-address">${icon('mappin', { size: 14 })}${esc(s.address)}</p></div></div>
    <div class="photo">${icon(category.icon, { size: 44 })}</div>
    ${parts.box(s.recommendation)}
    <span class="brutal-button secondary" style="align-self:flex-start">${icon('map', { size: 18 })}${esc(data.strings.openInMaps)}</span>
  </article>`;
  Mock.mount(Mock.screen({
    nav: { title: '', back: true, trailing: ['share'] },
    body: `<div class="detail">
      <header class="head"><div class="head-top">
        <h1 class="detail-title">${esc(post.title)}</h1>
        <p class="detail-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div></div>
        <div class="detail-meta"><p class="detail-author">${esc(post.authorName)}<span>${esc(post.date)}</span></p>${parts.likeButton(post)}${parts.starButton(post)}</div>
      </header>
      ${post.spots.slice(0, 2).map(spot).join('')}
    </div>`,
  }));
</script>
</body>
</html>
