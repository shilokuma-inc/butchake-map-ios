<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-4 ネオブルータリズム — ホーム</title>
<meta name="mock-fonts" content="Dela Gothic One|Murecho">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Murecho:wght@500;700;800;900&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 6px 16px 10px; }
  .ranking { display: flex; align-items: stretch; margin: 4px 16px 0; border: var(--border); background: #FFFFFF; box-shadow: var(--shadow); }
  .ranking .num { display: flex; align-items: center; justify-content: center; width: 84px; border-right: var(--border); background: var(--red); font-family: var(--font-number); font-size: 52px; }
  .ranking .body { flex: 1; padding: 10px 12px; }
  .ranking .label { font-weight: 900; font-size: 13px; }
  .ranking .title { margin-top: 2px; font-weight: 900; font-size: 16px; line-height: 1.35; }
  .ranking .likes { margin-top: 4px; font-family: var(--font-number); font-size: 15px; }
  .home { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .carousel { padding: 0 16px 8px; gap: 14px; }
  .feed { display: flex; flex-direction: column; gap: 18px; padding: 0 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: ブロックのロゴ・今週の 1 位を大きな数字で・ベタ塗りの帯のカード・新着の投稿
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  const weeklyTop = byLikes[0];
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(30) },
    tab: 'home',
    body: `<div class="ranking"><span class="num" aria-label="1位">1</span><div class="body"><p class="label">今週いちばんのぶっちゃけ</p>
        <p class="title">${Mock.esc(weeklyTop.title)}</p><p class="likes">♥ ${weeklyTop.likeCount}</p></div></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks, 'NEW', '#3BCB7A')}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'HOT', '#FF5A36')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts)}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
