<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A-4「ネオブルータリズム」のアプリアイコン: 黄色の地に、黒い太枠と影のブロックを 3 つ積んだ「三大」。いちばん上は青で、白い「!」。角丸は iOS がかけるので描かない -->
  <rect width="1024" height="1024" fill="#FFD60A"/>
  <g stroke="#111111" stroke-width="28" stroke-linejoin="miter">
    <rect x="232" y="640" width="560" height="190" fill="#111111" transform="translate(30 30)"/>
    <rect x="232" y="640" width="560" height="190" fill="#3BCB7A"/>
    <rect x="292" y="430" width="440" height="190" fill="#111111" transform="translate(30 30)"/>
    <rect x="292" y="430" width="440" height="190" fill="#FF5A36"/>
    <rect x="352" y="190" width="320" height="220" fill="#111111" transform="translate(30 30)"/>
    <rect x="352" y="190" width="320" height="220" fill="#4361EE"/>
  </g>
  <rect x="482" y="226" width="60" height="110" fill="#FFFFFF"/>
  <rect x="482" y="352" width="60" height="38" fill="#FFFFFF"/>
  <g fill="#111111">
    <rect x="380" y="510" width="264" height="32"/>
    <rect x="320" y="720" width="384" height="32"/>
  </g>
</svg>
