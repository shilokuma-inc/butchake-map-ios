<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>A-4 ネオブルータリズム — 動きのコマ割り</title>
<meta name="mock-fonts" content="Dela Gothic One|Murecho">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Murecho:wght@500;700;800;900&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: var(--color-bg); }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 20px; margin-top: 36px; }
  .motion-note h2 { display: inline-block; padding: 2px 10px; border: var(--border); background: var(--yellow); font-family: var(--font-heading); font-weight: 400; font-size: 16px; white-space: nowrap; box-shadow: 4px 4px 0 var(--ink); }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { font-weight: 900; white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 10px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; border: var(--border); background: #FFFFFF; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 800; }
  .frame-cap .time { padding: 1px 8px; border: 2px solid var(--ink); background: var(--yellow); font-family: var(--font-number); font-size: 13px; }
  .tap { position: absolute; z-index: 3; width: 46px; height: 46px; border: 3px dashed var(--ink); border-radius: 50%; }
  .like-big { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: var(--border); background: #FFFFFF; font-family: var(--font-number); font-size: 24px; }
  .like-big.on { background: var(--red); }
  .mini-card { position: relative; width: 200px; padding: 12px; border: var(--border); background: #FFFFFF; font-size: 14px; font-weight: 900; line-height: 1.4; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon, parts } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  // 押すと影が消えて右下へ沈む（ブルータリズムのボタンの押し込み）
  const like = (on, count, pressed) => `<span class="like-big${on ? ' on' : ''}" style="box-shadow:${pressed ? '0 0 0 #111' : '6px 6px 0 #111'};transform:translate(${pressed ? 6 : 0}px, ${pressed ? 6 : 0}px)">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const card = (shadow, y = 0, extra = '') => `<div class="mini-card" style="box-shadow:${shadow}px ${shadow}px 0 #111;transform:translateY(${y}px)">旅好きが推す横浜の三大夕景スポット${extra}</div>`;

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(34)}<p>A-4「ネオブルータリズム」の動き。押すと影が消えて沈む・札がガツンと落ちる・ブロックが落ちてくる。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、沈み込み・落下・揺れをやめて色の切り替えとフェードだけにする。点滅はしない。</p></div>

    <div class="motion">
      ${note('いいね（押し込み）', [['時間', '0.3 秒'], ['イージング', '押した瞬間に影（6pt）が消えてボタンが右下へ 6pt 沈む（linear 0.06 秒）。離すと赤くなり、easeOut 0.2 秒で影ごと戻る'], ['ハプティクス', '沈んだときに impact（rigid）'], ['Reduce Motion', '沈み込みをやめ、赤への色の切り替えだけ（0.15 秒）']])}
      ${frame('0.00', 'ふつう', like(false, 128, false))}
      ${frame('0.06', '押して沈む（影が消える）', `${like(false, 128, true)}<span class="tap" style="left:82px;top:132px"></span>`)}
      ${frame('0.12', '赤くなる', like(true, 129, true))}
      ${frame('0.30', '影ごと戻る', like(true, 129, false))}
    </div>

    <div class="motion">
      ${note('投稿の公開（札をガツン）', [['時間', '0.9 秒'], ['イージング', '「公開」の札が上から easeIn 0.2 秒で落ち、着地で 4pt だけ跳ね返る。続けてホームの新着の先頭にカードが落ち、NEW の札が 1.4 倍から easeOut 0.25 秒で貼られる'], ['ハプティクス', '着地で impact（heavy）、NEW の札が貼られたら notification（success）'], ['Reduce Motion', '落下・跳ね返り・拡大をやめ、札とカードを 0.2 秒でフェードイン']])}
      ${frame('0.00', '「公開する」を押す', '<span class="brutal-button yellow" style="font-size:18px;padding:14px 24px">公開する</span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.12', '「公開」の札が落ちてくる', '<span class="brutal-button" style="font-size:26px;padding:16px 28px;transform:translateY(-40px) rotate(-3deg)">公開！</span>')}
      ${frame('0.20', '着地して跳ね返る', '<span class="brutal-button" style="font-size:26px;padding:16px 28px;box-shadow:8px 8px 0 #111">公開！</span>')}
      ${frame('0.90', '新着の先頭に NEW', `${card(5, 0, '<span class="tag" style="position:absolute;right:-10px;top:-14px;padding:2px 8px;border:3px solid #111;background:#3BCB7A;font-size:13px">NEW</span>')}`)}
    </div>

    <div class="motion">
      ${note('カードの出現（ブロックが落ちる）', [['時間', '0.4 秒（1 まいずつ 0.06 秒ずらす）'], ['イージング', '24pt 上から easeIn 0.18 秒で落ち、着地で影が 0 → 5pt に伸びる（easeOut 0.12 秒）'], ['ハプティクス', 'なし（スクロールのたびに震えないよう）'], ['Reduce Motion', '落下をやめ、影ごと 0.2 秒でフェードイン']])}
      ${frame('0.00', '24pt 上で待つ', card(0, -24))}
      ${frame('0.12', '落ちてくる', card(0, -10))}
      ${frame('0.18', '着地（影はまだ無い）', card(0, 0))}
      ${frame('0.30', '影が伸びて止まる', card(5, 0))}
    </div>
  </div>`);
</script>
</body>
</html>
