<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-5 バラエティ番組のテロップ — 投稿詳細</title>
<meta name="mock-fonts" content="RocknRoll One|Zen Kaku Gothic Antique">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+Antique:wght@500;700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 20px; padding: 6px 16px 0; }
  .head { position: relative; padding: 16px 16px 14px; border-radius: 14px; background: #FFFFFF; box-shadow: var(--shadow-card); }
  .detail-title { padding-right: 60px; font-family: var(--font-heading); font-size: 23px; line-height: 1.45; }
  .detail-area { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 15px; color: var(--color-text-secondary); }
  .head .badges { margin-top: 10px; }
  .head .hanko { position: absolute; right: 12px; top: 14px; }
  .detail-meta { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-separator); }
  .detail-author { flex: 1; font-size: 15px; }
  .detail-author span { display: block; margin-top: 4px; font-size: 13px; color: var(--color-text-secondary); }
  .spot { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
  .screen-frame { position: relative; height: 128px; border-radius: 10px; background: linear-gradient(135deg, #1C3FAA, #3A63D6); color: #FFFFFF; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .screen-frame .rank-telop { position: absolute; left: 0; top: 12px; padding: 4px 14px 4px 10px; background: var(--red); font-family: var(--font-heading); font-size: 20px; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .screen-frame .wipe { position: absolute; right: 10px; bottom: 10px; }
  .spot-name { font-family: var(--font-heading); font-size: 19px; line-height: 1.35; }
  .spot-address { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 14px; color: var(--color-text-secondary); }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 投稿詳細: タイトルとハンコ・作者といいね／スター。スポットは番組の画面の枠（左上に順位のテロップ・右下にワイプ）と、下テロップのコメント
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const faces = ['', 'wow', 'smile', 'tsukkomi'];
  const spot = s => `<article class="card spot">
    <div class="screen-frame"><span class="rank-telop" aria-label="${s.order}位">第${s.order}位</span>${icon(category.icon, { size: 44 })}${Mock.face(faces[s.order], 50)}</div>
    <div><p class="spot-name">${esc(s.name)}</p><p class="spot-address">${icon('mappin', { size: 14 })}${esc(s.address)}</p></div>
    ${parts.lowerThird(s.recommendation)}
    <span class="tv-button secondary" style="align-self:flex-start">${icon('map', { size: 18 })}${esc(data.strings.openInMaps)}</span>
  </article>`;
  Mock.mount(Mock.screen({
    nav: { title: '', back: true, trailing: ['share'] },
    body: `<div class="detail">
      <header class="head">${parts.hanko()}
        <h1 class="detail-title">${esc(post.title)}</h1>
        <p class="detail-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div class="detail-meta"><p class="detail-author">${esc(post.authorName)}<span>${esc(post.date)}</span></p>${parts.likeButton(post)}${parts.starButton(post)}</div>
      </header>
      ${post.spots.slice(0, 2).map(spot).join('')}
    </div>`,
  }));
</script>
</body>
</html>
