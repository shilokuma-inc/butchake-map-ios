<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>A-5 バラエティ番組のテロップ — ホーム</title>
<meta name="mock-fonts" content="RocknRoll One|Zen Kaku Gothic Antique">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+Antique:wght@500;700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 6px 18px 10px; }
  .onair { position: relative; margin: 0 16px; padding: 14px 16px; height: 118px; border-radius: 14px; background: linear-gradient(135deg, #1C3FAA, #3A63D6); overflow: hidden; }
  .onair .big { position: relative; font-family: var(--font-heading); font-size: 28px; line-height: 1.25; }
  .onair .wipe { position: absolute; right: 14px; bottom: 12px; }
  .onair .live { display: inline-block; margin-bottom: 6px; padding: 1px 8px; border-radius: 4px; background: var(--red); color: #FFFFFF; font-family: var(--font-heading); font-size: 13px; }
  .home { display: flex; flex-direction: column; gap: 20px; padding-top: 22px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .carousel { padding: 14px 16px 8px; margin-top: -10px; gap: 12px; }
  .feed { display: flex; flex-direction: column; gap: 18px; padding: 10px 16px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: 番組のタイトルロゴ・オンエア中の帯（縁取りの大きな文字とワイプ）・テロップの見出し・ハンコを押したカード
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(32) },
    tab: 'home',
    body: `<div class="onair"><span class="live">ON AIR</span><p class="big outline">今夜も本音、<br>ぶっちゃけます！</p>${Mock.face('wow', 62)}</div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks)}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'red')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts, 'yellow')}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
