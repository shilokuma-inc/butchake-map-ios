<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>A-5 バラエティ番組のテロップ — 動きのコマ割り</title>
<meta name="mock-fonts" content="RocknRoll One|Zen Kaku Gothic Antique">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+Antique:wght@500;700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: var(--color-bg); }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 18px; margin-top: 36px; }
  .motion-note h2 { display: inline-flex; max-width: 300px; font-size: 15px; white-space: nowrap; }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { color: var(--red); white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; border-radius: 14px; background: #FFFFFF; box-shadow: var(--shadow-card); display: flex; align-items: center; justify-content: center; }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
  .frame-cap .time { padding: 1px 10px; border-radius: 4px; background: var(--ink); color: #FFFFFF; font-family: var(--font-number); font-size: 13px; }
  .tap { position: absolute; z-index: 3; width: 46px; height: 46px; border: 2.5px dashed var(--red); border-radius: 50%; }
  .like-big { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--ink); font-family: var(--font-heading); font-size: 22px; }
  .like-big.on { color: var(--red); }
  .tv { position: absolute; inset: 0; background: linear-gradient(135deg, #1C3FAA, #3A63D6); }
  .big { position: absolute; font-family: var(--font-heading); }
  .mini-card { width: 200px; padding: 12px; border-radius: 12px; background: #FFFFFF; box-shadow: var(--shadow-card); font-family: var(--font-heading); font-size: 15px; line-height: 1.4; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon, parts } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2 class="telop">${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  const like = (on, count, scale = 1) => `<span class="like-big${on ? ' on' : ''}" style="transform:scale(${scale})">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const card = style => `<div class="mini-card" style="${style}">旅好きが推す横浜の<br>三大夕景スポット</div>`;

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(40)}<p>A-5「バラエティ番組のテロップ」の動き。ワイプの顔がリアクション・大きなテロップがドーンと出る・下テロップが横から入る。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、拡大・横の移動をやめてフェードだけにする。点滅はしない（テロップも明滅させない）。</p></div>

    <div class="motion">
      ${note('いいね（ワイプのリアクション）', [['時間', '0.6 秒'], ['イージング', 'ハートは spring（response 0.3・damping 0.6）で 1.2 倍。右下にワイプの顔が easeOut 0.2 秒で出て、0.25 秒後にフェードで消える'], ['ハプティクス', '塗ったときに impact（medium）'], ['Reduce Motion', 'ワイプと拡大をやめ、ハートの塗りと件数の色を 0.15 秒でクロスフェード']])}
      ${frame('0.00', '押す', `${like(false, 128, 0.95)}<span class="tap" style="left:60px;top:126px"></span>`)}
      ${frame('0.12', 'ハートが弾む', like(true, 129, 1.2))}
      ${frame('0.30', 'ワイプの顔がリアクション', `${like(true, 129)}<span style="position:absolute;right:12px;bottom:14px">${Mock.face('wow', 64)}</span>`)}
      ${frame('0.60', 'ワイプが消えて落ち着く', `${like(true, 129)}<span style="position:absolute;right:12px;bottom:14px;opacity:.25">${Mock.face('wow', 64)}</span>`)}
    </div>

    <div class="motion">
      ${note('投稿の公開（テロップがドーン）', [['時間', '1.2 秒'], ['イージング', '画面が少し暗くなり、縁取りの大きな「公開！」が 1.6 倍から spring（damping 0.55）で出る。続けて下テロップが右から easeOut 0.25 秒で入る'], ['ハプティクス', '大きなテロップが出たときに notification（success）'], ['Reduce Motion', '拡大と横の移動をやめ、テロップを 0.2 秒でフェードイン']])}
      ${frame('0.00', '「公開する」を押す', '<span class="tv-button" style="font-size:18px;padding:14px 26px">公開する</span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.25', '大きなテロップ', '<div class="tv"></div><span class="big outline" style="font-size:52px;transform:scale(1.15) rotate(-6deg)">公開！</span>')}
      ${frame('0.60', '下テロップが入る', '<div class="tv"></div><span class="big outline" style="top:70px;font-size:46px;transform:rotate(-6deg)">公開！</span><span class="telop yellow" style="position:absolute;left:20px;bottom:40px;font-size:15px">ホームに出ました</span>')}
      ${frame('1.20', 'ホームの先頭に並ぶ', `<div style="position:relative;padding-top:34px">${parts.hanko('ぶっ<br>ちゃけ', 'position:absolute;right:-6px;top:0')}${card('')}</div>`)}
    </div>

    <div class="motion">
      ${note('カードの出現（テロップ風）', [['時間', '0.4 秒（1 まいずつ 0.06 秒ずらす）'], ['イージング', '左から 40pt、easeOut 0.3 秒で滑り込み、最後に 1.02 倍から 1 倍に戻る'], ['ハプティクス', 'なし（スクロールのたびに震えないよう）'], ['Reduce Motion', '横の移動をやめ、0.2 秒でフェードイン']])}
      ${frame('0.00', '左の外で待つ', card('transform:translateX(-200px);opacity:.4'))}
      ${frame('0.15', '滑り込む', card('transform:translateX(-40px)'))}
      ${frame('0.30', '少し大きく止まる', card('transform:scale(1.02)'))}
      ${frame('0.40', 'そろう', card(''))}
    </div>
  </div>`);
</script>
</body>
</html>
