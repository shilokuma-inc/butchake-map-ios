<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-1 昭和の観光パンフ — 投稿詳細</title>
<meta name="mock-fonts" content="Dela Gothic One|Zen Kaku Gothic New|Shippori Mincho B1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 20px; padding: 6px 16px 0; }
  .detail-head { position: relative; padding: 16px 16px 14px; background: var(--paper); border-top: 6px double var(--vermilion); border-bottom: 6px double var(--vermilion); }
  .detail-kicker { font-family: var(--font-mincho); font-weight: 800; font-size: 13px; letter-spacing: .2em; color: var(--vermilion); }
  .detail-title { margin-top: 6px; padding-right: 64px; font-family: var(--font-heading); font-weight: 400; font-size: 23px; line-height: 1.4; color: var(--navy); }
  .detail-area { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 15px; font-weight: 700; color: var(--color-text-secondary); }
  .detail-head .badges { margin-top: 10px; }
  .detail-meta { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--color-separator); }
  .detail-author { flex: 1; font-size: 15px; font-weight: 700; }
  .detail-author span { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
  .detail-head .postmark { position: absolute; top: 14px; right: 10px; }
  .spot { background: var(--paper); box-shadow: var(--shadow-card); }
  .spot-band { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--vermilion); color: var(--paper); }
  .spot-band .no { font-family: var(--font-mincho); font-weight: 800; font-size: 18px; letter-spacing: .1em; }
  .spot-band .cat { margin-left: auto; font-size: 13px; font-weight: 700; }
  .spot-body { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
  .postcard { position: relative; height: 128px; overflow: hidden; background: var(--navy); }
  .postcard > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .postcard .icon-wrap { position: absolute; left: 50%; top: 46%; display: inline-flex; padding: 12px; transform: translate(-50%, -50%);
    border-radius: 50%; background: var(--cream); color: var(--navy); }
  .spot-name { font-family: var(--font-heading); font-weight: 400; font-size: 19px; color: var(--navy); line-height: 1.35; }
  .spot-address { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 14px; color: var(--color-text-secondary); }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 投稿詳細: パンフレットの扉のような見出し（二重線・消印）、「其の一」の帯を付けたスポット、絵はがき風の写真の枠、便せんのコメント
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const ordinal = ['', '其の一', '其の二', '其の三'];
  const postcard = `<svg viewBox="0 0 340 128" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#F6ECD6" stroke-width="2" opacity=".35">
      <path d="M-10 110 q12 -12 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
      <path d="M-10 122 q12 -12 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/></g>
    <circle cx="282" cy="34" r="16" fill="#B23A26"/></svg>`;
  const spot = s => `<article class="spot">
    <div class="spot-band"><span class="no" aria-label="${s.order}位">${ordinal[s.order]}</span><span class="cat">${esc(category.title)}</span></div>
    <div class="spot-body">
      <div class="postcard">${postcard}<span class="icon-wrap">${icon(category.icon, { size: 34 })}</span></div>
      <div><p class="spot-name">${esc(s.name)}</p><p class="spot-address">${icon('mappin', { size: 14 })}${esc(s.address)}</p></div>
      ${parts.comment(s.recommendation)}
      <span class="retro-button secondary" style="align-self:flex-start">${icon('map', { size: 18 })}${esc(data.strings.openInMaps)}</span>
    </div></article>`;
  const [year, month, day] = post.date.split('/');
  Mock.mount(Mock.screen({
    nav: { title: '', back: true, trailing: ['share'] },
    body: `<div class="detail">
      <header class="detail-head">
        ${parts.postmark(year, `${Number(month)}.${Number(day)}`, post.city)}
        <p class="detail-kicker">マイ三大 ご案内</p>
        <h1 class="detail-title">${esc(post.title)}</h1>
        <p class="detail-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div class="detail-meta"><p class="detail-author">${esc(post.authorName)}<span>${esc(post.date)} 投稿</span></p>
          ${parts.likeButton(post)}${parts.starButton(post)}</div>
      </header>
      ${post.spots.slice(0, 2).map(spot).join('')}
    </div>`,
  }));
</script>
</body>
</html>
