<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-1 昭和の観光パンフ — ホーム</title>
<meta name="mock-fonts" content="Dela Gothic One|Zen Kaku Gothic New|Shippori Mincho B1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 4px 18px 8px; }
  .cover { position: relative; margin: 4px 16px 0; height: 92px; overflow: hidden; border-radius: 4px; background: var(--navy); color: var(--cream); }
  .cover svg { position: absolute; inset: 0; }
  .cover p { position: absolute; left: 18px; top: 18px; font-family: var(--font-mincho); font-weight: 800; font-size: 19px; letter-spacing: .08em; line-height: 1.5; }
  .cover p small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #F2D9A0; }
  .home { display: flex; flex-direction: column; gap: 22px; padding-top: 22px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .section-header { padding: 0 18px; }
  .carousel { padding: 0 16px 4px; }
  .feed { display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: ロゴ・パンフレットの表紙の帯・切手のカルーセル（今週のぶっちゃけ／急上昇）・消印を押した新着の投稿
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  // 表紙の帯の絵（山と太陽と波。自分で描いた SVG）
  const cover = `<svg viewBox="0 0 370 92" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <circle cx="300" cy="40" r="22" fill="#B23A26"/>
    <path d="M190 92 L262 34 L292 56 L318 38 L380 92 Z" fill="#F6ECD6" opacity=".92"/>
    <path d="M252 42 L262 34 L272 42 L266 46 L262 42 L258 46 Z" fill="#FFFAEE"/>
    <g fill="none" stroke="#F6ECD6" stroke-width="2" opacity=".55">
      <path d="M150 84 q10 -10 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
    </g></svg>`;
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(32) },
    tab: 'home',
    body: `<div class="cover">${cover}<p>ようこそ、本音の旅へ。<small>地元民と旅人の「マイ三大」案内</small></p></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks, '今週の名所案内')}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'いま人気の旅先')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts, '旅だより')}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
