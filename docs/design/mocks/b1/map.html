<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-1 昭和の観光パンフ — マップ</title>
<meta name="mock-fonts" content="Dela Gothic One|Zen Kaku Gothic New|Shippori Mincho B1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .map-screen .screen-scroll { z-index: 1; pointer-events: none; }
  .map-screen .status-bar { background: var(--cream); }
  .map-screen .nav-bar { background: var(--cream); border-bottom: 6px double var(--navy); }
  .map-screen .nav-inline-title { font-family: var(--font-heading); font-weight: 400; font-size: 19px; color: var(--navy); letter-spacing: .1em; }
  .map-illustration { top: 106px; }
  .map-deco { position: absolute; inset: 106px 0 0; z-index: 1; pointer-events: none; }
  .map-label { position: absolute; z-index: 2; padding: 2px 8px; border: 1.5px solid var(--navy); background: var(--paper); color: var(--navy);
    font-family: var(--font-mincho); font-weight: 800; font-size: 13px; letter-spacing: .1em; }
  .map-illustration .map-pin { z-index: 3; }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 418px; padding: 12px 16px 34px; z-index: 5;
    border-top: 6px double var(--vermilion); background: var(--paper); box-shadow: 0 -6px 18px rgba(43, 36, 32, .18);
    display: flex; flex-direction: column; gap: 10px; }
  .grabber { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #C9B48A; }
  .sheet-title { font-family: var(--font-heading); font-weight: 400; font-size: 19px; line-height: 1.4; color: var(--navy); }
  .sheet-area { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 15px; font-weight: 700; color: var(--color-text-secondary); }
  .spot-line { display: flex; align-items: flex-start; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--color-separator); }
  .spot-name { font-size: 17px; font-weight: 700; }
  .spot-address { font-size: 15px; color: var(--color-text-secondary); }
  .letter-text { font-size: 15px; }
  .sheet-actions { display: flex; align-items: center; gap: 16px; margin-top: auto; }
  .sheet-actions .retro-button { margin-left: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // マップ: 観光案内図のようなイラストの地図（線路・方位・地名の札）に、朱のはんこのピン。選んだピンは紺で大きく
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const spot = post.spots[1];
  const pins = post.spots.map(s => ({ order: s.order, x: s.mapPosition.x, y: s.mapPosition.y * 0.5 + 6, selected: s === spot }));
  // 線路（紺の破線）・方位・波の線（自分で描いた SVG）
  const deco = `<svg class="map-deco" viewBox="0 0 402 768" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <path d="M-10 70 C 120 120, 220 40, 420 110" fill="none" stroke="#1F3A68" stroke-width="6"/>
    <path d="M-10 70 C 120 120, 220 40, 420 110" fill="none" stroke="#FFFAEE" stroke-width="3" stroke-dasharray="10 10"/>
    <g transform="translate(352 44)" fill="none" stroke="#1F3A68" stroke-width="1.6">
      <circle r="20"/><path d="M0 -26 L5 0 L0 26 L-5 0 Z" fill="#1F3A68"/><path d="M-26 0 H26"/></g>
    <text x="352" y="13" text-anchor="middle" font-family="Shippori Mincho B1" font-weight="800" font-size="12" fill="#1F3A68">北</text>
  </svg>`;
  const labels = '<span class="map-label" style="left:18px;top:222px">近江町</span><span class="map-label" style="left:262px;top:250px">香林坊</span>';
  Mock.mount(Mock.screen({
    className: 'map-screen',
    nav: { title: 'マップ' },
    overlay: `${Mock.mapIllustration(pins)}${deco}${labels}
      <section class="sheet-panel">
        <span class="grabber"></span>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div><h2 class="sheet-title">${esc(post.title)}</h2>
          <p class="sheet-area">${icon('mappin', { size: 14 })}${esc(post.prefecture)} ${esc(post.city)}</p></div>
        <div class="spot-line">${parts.rank(spot.order)}
          <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
        ${parts.comment(spot.recommendation)}
        <div class="sheet-actions">${parts.likeButton(post)}${parts.starButton(post)}
          <span class="retro-button">${esc(data.strings.viewPost)}${icon('chevronRight', { size: 16 })}</span></div>
      </section>`,
  }));
</script>
</body>
</html>
