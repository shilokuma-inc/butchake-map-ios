<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>B-1 昭和の観光パンフ — 動きのコマ割り</title>
<meta name="mock-fonts" content="Dela Gothic One|Zen Kaku Gothic New|Shippori Mincho B1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: var(--cream); }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 18px; margin-top: 36px; }
  .motion-note h2 { display: flex; align-items: center; gap: 10px; font-family: var(--font-heading); font-weight: 400; font-size: 20px; color: var(--navy); white-space: nowrap; }
  .motion-note h2::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--vermilion); }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { font-weight: 700; color: var(--vermilion); white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; background: var(--paper); border-top: 6px double var(--vermilion); border-bottom: 6px double var(--vermilion);
    display: flex; align-items: center; justify-content: center; }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; font-weight: 700; }
  .frame-cap .time { padding: 1px 8px; border-radius: 3px; background: var(--navy); color: var(--paper); font-family: var(--font-number); font-size: 13px; }
  .tap { position: absolute; width: 46px; height: 46px; border: 2px dashed var(--navy); border-radius: 50%; }
  /* いいね */
  .like-big { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border: 2px solid var(--navy); border-radius: 4px; background: var(--paper);
    font-size: 22px; font-weight: 700; color: var(--ink); }
  .like-big .icon { color: var(--ink); }
  .like-big.on .icon { color: var(--vermilion); }
  .hanko-block { position: absolute; width: 70px; height: 92px; border-radius: 6px 6px 3px 3px; background: linear-gradient(90deg, #8A6A44, #B08C5E 50%, #8A6A44); }
  .hanko-block::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -6px; height: 10px; border-radius: 2px; background: var(--vermilion); }
  .seal { position: absolute; display: inline-flex; align-items: center; justify-content: center; width: 70px; height: 70px; border: 3px solid var(--vermilion);
    border-radius: 50%; color: var(--vermilion); font-family: var(--font-mincho); font-weight: 800; font-size: 18px; transform: rotate(-12deg); }
  /* 公開 */
  .mini-stamp { width: 170px; height: 130px; }
  .mini-stamp .stamp-inner { display: flex; flex-direction: column; justify-content: space-between; font-size: 13px; font-weight: 700; }
  .mini-stamp .t { font-size: 14px; line-height: 1.4; }
  /* 切手が貼られる */
  .album { position: absolute; inset: 24px 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-items: center; }
  .slot { height: 120px; border: 2px dashed #C9B48A; }
  .tiny-stamp { height: 120px; padding: 5px; }
  .tiny-stamp .stamp-inner { padding: 5px 4px; display: flex; flex-direction: column; justify-content: space-between; }
  .tiny-stamp .rank { width: 22px; height: 22px; font-size: 13px; }
  .tiny-stamp p { font-size: 11px; font-weight: 700; line-height: 1.3; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon, parts } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  const like = (on, count) => `<span class="like-big${on ? ' on' : ''}">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const miniStamp = (style = '') => `<div class="stamp mini-stamp" style="${style}"><div class="stamp-inner">
    <span class="t">旅好きが推す横浜の三大夕景スポット</span><span style="color:var(--color-text-secondary)">神奈川県 横浜市</span></div></div>`;
  const tiny = (order, name, style = '') => `<div class="stamp tiny-stamp" style="${style}"><div class="stamp-inner">${parts.rank(order)}<p>${name}</p></div></div>`;
  const slots = filled => `<div class="album">${[1, 2, 3].map(n => {
    const names = ['', 'すし食いねぇ！', 'もりもり寿し', 'まいもん寿司'];
    const f = filled[n - 1];
    if (!f) {
      return '<div class="slot"></div>';
    }
    return tiny(n, names[n], `transform:translateY(${f.y}px) rotate(${f.r}deg);opacity:${f.o}`);
  }).join('')}</div>`;

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(40)}<p>B-1「昭和の観光パンフ」の動き。はんこを押す・消印を押す・切手を貼る、の手ざわりで見せる。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、はんこ・揺れ・移動をやめてフェードだけにする。点滅はしない。</p></div>

    <div class="motion">
      ${note('いいね（はんこを押す）', [['時間', '0.5 秒'], ['イージング', 'はんこが easeIn 0.22 秒で下りて押し、押した瞬間にボタンが 0.96 倍へ縮んで戻る（spring・damping 0.7）。朱の印は 0.3 秒残してフェード'], ['ハプティクス', '3 コマ目の押した瞬間に impact（medium）'], ['Reduce Motion', 'はんこと印を出さず、ハートの塗りと件数を 0.15 秒でクロスフェード']])}
      ${frame('0.00', '押す', `${like(false, 128)}<span class="tap" style="left:58px;top:126px"></span>`)}
      ${frame('0.10', 'はんこが下りてくる', `<span class="hanko-block" style="left:96px;top:36px"></span>${like(false, 128)}`)}
      ${frame('0.22', 'ポンと押される', `<span class="seal" style="left:120px;top:60px">いいね</span>${like(true, 129)}`)}
      ${frame('0.50', '印が薄れ、ハートが残る', `<span class="seal" style="left:120px;top:60px;opacity:.25">いいね</span>${like(true, 129)}`)}
    </div>

    <div class="motion">
      ${note('投稿の公開（消印を押す）', [['時間', '1.0 秒'], ['イージング', '切手のカードが easeOut 0.25 秒で下から上がり、消印が 1.4 倍から spring（damping 0.6）で押される。押した後にカードが 2pt だけ 2 往復揺れる。最後は easeInOut でホームの「旅だより」の先頭へ'], ['ハプティクス', '3 コマ目の消印で notification（success）'], ['Reduce Motion', '上がる・揺れる・飛ぶをやめ、消印を 0.2 秒でフェードイン。ホームのカードもフェードで出す']])}
      ${frame('0.00', '「公開する」を押す', '<span class="retro-button vermilion" style="font-size:18px;padding:14px 26px">公開する</span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.25', '切手のカードが上がる', miniStamp('transform:translateY(-6px) rotate(-2deg)'))}
      ${frame('0.45', '消印がドンと押される', `${miniStamp('transform:rotate(-2deg)')}${parts.postmark('ぶっちゃけ', '公開', '旅だより', 'position:absolute;left:150px;top:70px;transform:rotate(-14deg) scale(1.1)')}`)}
      ${frame('1.00', '「旅だより」の先頭に並ぶ', `<div style="display:flex;flex-direction:column;gap:10px;align-items:center">${parts.sectionHeader('新着の投稿', '旅だより')}${miniStamp()}</div>`)}
    </div>

    <div class="motion">
      ${note('カードの出現（切手を貼る）', [['時間', '0.55 秒（1 枚 0.3 秒・0.08 秒ずつずらす）'], ['イージング', '1 枚ずつ 8pt 上から ±4° 傾けて置き、easeOut で傾きを戻す'], ['ハプティクス', 'なし（スクロールのたびに震えないよう）'], ['Reduce Motion', '傾き・移動をやめ、3 枚をいっしょに 0.2 秒でフェードイン']])}
      ${frame('0.00', '空いた台紙', slots([null, null, null]))}
      ${frame('0.08', '1 枚目を置く', slots([{ y: -8, r: -4, o: 0.6 }, null, null]))}
      ${frame('0.24', '2 枚目・3 枚目が続く', slots([{ y: 0, r: 0, o: 1 }, { y: -4, r: 3, o: 0.8 }, { y: -8, r: -4, o: 0.4 }]))}
      ${frame('0.55', '3 枚がそろう', slots([{ y: 0, r: 0, o: 1 }, { y: 0, r: 0, o: 1 }, { y: 0, r: 0, o: 1 }]))}
    </div>
  </div>`);
</script>
</body>
</html>
