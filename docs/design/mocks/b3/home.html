<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-3 純喫茶のメニュー — ホーム</title>
<meta name="mock-fonts" content="Zen Old Mincho|Kiwi Maru|Playfair Display">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Kiwi+Maru:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { display: flex; justify-content: center; padding: 4px 16px 8px; }
  .today { margin: 6px 22px 0; text-align: center; }
  .today p { font-family: var(--font-heading); font-weight: 700; font-size: 17px; line-height: 1.6; }
  .today p small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--color-text-secondary); }
  .home { display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .section-header { padding: 0 18px; }
  .carousel { padding: 0 16px 8px; gap: 14px; }
  .feed { display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: 看板のロゴ・レースペーパーの「本日のおすすめ」・メニュー表のカルーセル・新着の投稿
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(30) },
    tab: 'home',
    body: `<div class="lace today"><p>本日のおすすめ<small>地元民と旅人の、本音の三大をどうぞ。</small></p></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks, 'This week')}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'Popular')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts, 'New')}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
