<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="1400x1320">
<meta name="mock-scale" content="2">
<title>B-3 純喫茶のメニュー — 動きのコマ割り</title>
<meta name="mock-fonts" content="Zen Old Mincho|Kiwi Maru|Playfair Display">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Kiwi+Maru:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .sheet { width: 1400px; height: 1320px; padding: 48px 56px; background: var(--cream); }
  .sheet-head { display: flex; align-items: center; gap: 28px; }
  .sheet-head p { font-size: 17px; line-height: 1.6; }
  .motion { display: grid; grid-template-columns: 300px repeat(4, 1fr); gap: 18px; margin-top: 36px; }
  .motion-note h2 { white-space: nowrap; font-family: var(--font-heading); font-weight: 900; font-size: 19px; letter-spacing: .06em; padding-bottom: 6px; border-bottom: 1px solid var(--gold); }
  .motion-note dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; }
  .motion-note dt { color: var(--red); white-space: nowrap; }
  .motion-note dd { margin: 0; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame-box { position: relative; height: 300px; overflow: hidden; border-radius: 6px; background: var(--paper);
    box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--gold), var(--shadow-card); display: flex; align-items: center; justify-content: center; }
  .frame-cap { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
  .frame-cap .time { padding: 1px 10px; border-radius: 999px; background: var(--brown); color: var(--cream); font-family: var(--font-number); font-style: italic; font-size: 13px; }
  .tap { position: absolute; z-index: 3; width: 46px; height: 46px; border: 2px dashed var(--red); border-radius: 50%; }
  .like-big { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; background: var(--paper); font-size: 22px;
    box-shadow: 0 0 0 1px var(--gold), var(--shadow-card); }
  .like-big.on { color: var(--red); }
  .heart-steam { position: absolute; color: var(--red); }
  .order { width: 210px; padding: 14px; border-radius: 4px; background: var(--paper); box-shadow: inset 4px 0 0 var(--red), var(--shadow-card); font-size: 14px; line-height: 1.5; }
  .order .slip-label { margin-bottom: 4px; }
  .seal { position: absolute; display: inline-flex; align-items: center; justify-content: center; width: 78px; height: 78px; border: 3px solid var(--red); border-radius: 50%;
    color: var(--red); font-family: var(--font-heading); font-weight: 900; font-size: 15px; line-height: 1.2; text-align: center; transform: rotate(-12deg); }
  .page { position: absolute; top: 30px; bottom: 30px; width: 180px; padding: 16px 14px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 1px var(--gold), var(--shadow-card); font-size: 14px; }
  .page h3 { font-family: var(--font-heading); font-weight: 900; font-size: 16px; line-height: 1.4; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // 動きのコマ割り。1 つの動きを 4 コマに分け、時間・イージング・ハプティクス・Reduce Motion のときの代わりを添える
  const { icon, parts } = Mock;
  const frame = (time, caption, inner) => `<div class="frame"><div class="frame-box">${inner}</div>
    <p class="frame-cap"><span class="time">${time}</span>${caption}</p></div>`;
  const note = (title, rows) => `<div class="motion-note"><h2>${title}</h2><dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  const like = (on, count) => `<span class="like-big${on ? ' on' : ''}">${icon(on ? 'heartFill' : 'heart', { size: 28 })}${count}</span>`;
  const heart = (x, y, size, opacity) => `<span class="heart-steam" style="left:${x}px;top:${y}px;opacity:${opacity}">${icon('heartFill', { size })}</span>`;
  const order = '<div class="order"><p class="slip-label">ご注文</p>旅好きが推す横浜の三大夕景スポット<br>No.1 大さん橋<br>No.2 港の見える丘公園<br>No.3 スカイガーデン</div>';
  const page = (left, rot, content, z = 1) => `<div class="page" style="left:${left}px;transform:perspective(600px) rotateY(${rot}deg);transform-origin:left center;z-index:${z}">${content}</div>`;
  const menuPage = '<h3>今週のぶっちゃけ</h3><p>金沢の三大回転寿司 …… No.1</p><p>札幌の三大シメパフェ …… No.2</p>';
  const detailPage = '<h3>金沢市民が本気で教える三大回転寿司</h3><p style="color:#A8262E;font-family:var(--font-script);font-style:italic">No.1</p><p>すし食いねぇ！ 県庁前店</p>';

  Mock.mount(`<div class="sheet">
    <div class="sheet-head">${Mock.logo(36)}<p>B-3「純喫茶のメニュー」の動き。湯気のようにハートが立ちのぼる・伝票に「承りました」の印・メニューをめくる。<br>
      どれも「視差効果を減らす」（Reduce Motion）がオンのときは、立ちのぼり・印の押し込み・めくりをやめてフェードだけにする。点滅はしない。</p></div>

    <div class="motion">
      ${note('いいね（湯気のハート）', [['時間', '0.7 秒'], ['イージング', 'ハートは easeOut 0.2 秒で塗る。小さなハートが 2 つ、湯気のように easeOut 0.6 秒でゆらぎながら 24pt 上がって消える'], ['ハプティクス', '塗ったときに impact（soft）'], ['Reduce Motion', '立ちのぼるハートを出さず、塗りと件数の色を 0.15 秒でクロスフェード']])}
      ${frame('0.00', '押す', `${like(false, 128)}<span class="tap" style="left:62px;top:126px"></span>`)}
      ${frame('0.20', 'ハートが塗られる', `${heart(84, 110, 16, 0.9)}${like(true, 129)}`)}
      ${frame('0.45', '湯気のように上がる', `${heart(78, 84, 16, 0.6)}${heart(102, 94, 12, 0.7)}${like(true, 129)}`)}
      ${frame('0.70', '消えて落ち着く', `${heart(84, 64, 16, 0.15)}${like(true, 129)}`)}
    </div>

    <div class="motion">
      ${note('投稿の公開（承りました）', [['時間', '1.1 秒'], ['イージング', '伝票が easeOut 0.3 秒で下から上がり、赤い丸印が 1.3 倍から spring（damping 0.7）で押される。伝票はそのまま easeInOut でホームの「新着の投稿」の先頭へ'], ['ハプティクス', '印を押した瞬間に notification（success）'], ['Reduce Motion', '上がる・押し込む・移動をやめ、印と「公開しました」を 0.2 秒でフェードイン']])}
      ${frame('0.00', '「公開する」を押す', '<span class="cafe-button red" style="font-size:18px;padding:14px 26px">公開する</span><span class="tap" style="left:150px;top:150px"></span>')}
      ${frame('0.30', '伝票が上がってくる', `<div style="transform:translateY(16px)">${order}</div>`)}
      ${frame('0.50', '「承りました」の印', `${order}<span class="seal" style="right:14px;bottom:24px">承り<br>ました</span>`)}
      ${frame('1.10', '新着の投稿の先頭に並ぶ', `<div style="display:flex;flex-direction:column;gap:10px;width:230px">${parts.sectionHeader('新着の投稿', 'New')}${order}</div>`)}
    </div>

    <div class="motion">
      ${note('画面遷移（メニューをめくる）', [['時間', '0.5 秒'], ['イージング', '今のページが左の綴じ目を軸に easeInOut 0.45 秒で 0° → -100° に回り、下から投稿詳細のページが出る'], ['ハプティクス', 'なし'], ['Reduce Motion', 'めくりをやめ、0.2 秒のクロスフェード']])}
      ${frame('0.00', 'カードを押す', `${page(24, 0, menuPage)}<span class="tap" style="left:120px;top:110px"></span>`)}
      ${frame('0.15', 'ページがめくれ始める', `${page(24, 0, detailPage)}${page(24, -28, menuPage, 2)}`)}
      ${frame('0.35', '半分ほどめくれる', `${page(24, 0, detailPage)}${page(24, -70, menuPage, 2)}`)}
      ${frame('0.50', '投稿詳細', page(24, 0, detailPage))}
    </div>
  </div>`);
</script>
</body>
</html>
