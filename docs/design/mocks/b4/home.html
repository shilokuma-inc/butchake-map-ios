<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-4 旅かばんのラベル — ホーム</title>
<meta name="mock-fonts" content="Train One|M PLUS 2|Bungee">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Train+One&family=M+PLUS+2:wght@500;700;800&family=Bungee&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 4px 16px 8px; }
  .suitcase { position: relative; margin: 4px 16px 0; height: 116px; border-radius: 14px; background: var(--navy); overflow: hidden;
    box-shadow: inset 0 0 0 4px var(--navy), inset 0 0 0 6px #3C5378; }
  .suitcase .oval { position: absolute; }
  .suitcase p { position: absolute; left: 16px; bottom: 12px; color: var(--paper); font-weight: 700; font-size: 15px; }
  .home { display: flex; flex-direction: column; gap: 22px; padding-top: 22px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .section-header { padding: 0 18px; }
  .carousel { padding: 0 16px 6px; gap: 12px; }
  .feed { display: flex; flex-direction: column; gap: 22px; padding: 10px 16px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: 楕円のホテルラベルのロゴ・旅かばんに貼ったラベルの帯・荷札のカルーセル・行き先のラベルを貼った新着の投稿
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(26) },
    tab: 'home',
    body: `<div class="suitcase">
        ${parts.oval('HOTEL', '金沢', '#1F6F6B', 'left:14px;top:12px;transform:rotate(-8deg)')}
        ${parts.oval('KYOTO', '京都', '#B8432F', 'left:126px;top:8px;transform:rotate(5deg)')}
        ${parts.oval('SAPPORO', '札幌', '#E0A526', 'right:16px;top:16px;transform:rotate(-4deg);color:#2A2420')}
        <p>次は、どの本音を旅しよう？</p></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks, 'THIS WEEK', '#E0A526')}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending, 'POPULAR', '#E0A526')}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts, 'NEW', '#E0A526')}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
