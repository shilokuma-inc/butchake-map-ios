  <rect width="1024" height="1024" fill="#E0A526"/>
  <rect x="380" y="150" width="264" height="120" rx="40" fill="none" stroke="#2A2420" stroke-width="40"/>
  <rect x="130" y="250" width="764" height="620" rx="70" fill="#23395B"/>
  <rect x="130" y="250" width="764" height="620" rx="70" fill="none" stroke="#3C5378" stroke-width="18"/>
  <path d="M130 560 H894" stroke="#3C5378" stroke-width="14"/>
  <g transform="rotate(-10 380 440)">
    <ellipse cx="380" cy="440" rx="190" ry="120" fill="#1F6F6B"/>
    <ellipse cx="380" cy="440" rx="168" ry="100" fill="none" stroke="#F7F0E1" stroke-width="10"/>
    <path d="M270 440 H490" stroke="#F7F0E1" stroke-width="22" stroke-linecap="round"/>
    <path d="M300 395 H460 M300 485 H460" stroke="#F7F0E1" stroke-width="10" stroke-linecap="round"/>
  </g>
