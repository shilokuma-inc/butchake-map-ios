<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-4 旅かばんのラベル — マップ</title>
<meta name="mock-fonts" content="Train One|M PLUS 2|Bungee">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Train+One&family=M+PLUS+2:wght@500;700;800&family=Bungee&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .map-screen .screen-scroll { z-index: 1; pointer-events: none; }
  .map-screen .status-bar, .map-screen .nav-bar { background: var(--paper); }
  .map-screen .nav-bar { border-bottom: 4px solid transparent; border-image: repeating-linear-gradient(90deg, var(--red) 0 14px, var(--paper) 14px 20px, var(--navy) 20px 34px, var(--paper) 34px 40px) 4; }
  .map-screen .nav-inline-title { font-family: var(--font-heading); font-weight: 400; font-size: 20px; color: var(--navy); }
  .map-illustration { top: 106px; }
  .map-illustration .map-pin { z-index: 3; }
  .map-illustration svg.flight { inset: 0; z-index: 2; }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; padding: 10px 16px 34px; z-index: 5;
    border-radius: 18px 18px 0 0; background: #FFFDF8; box-shadow: 0 -6px 18px rgba(42, 36, 32, .2); display: flex; flex-direction: column; gap: 10px; }
  .grabber { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--color-separator); }
  .sheet-title { font-family: var(--font-body); font-weight: 800; font-size: 19px; line-height: 1.4; color: var(--navy); }
  .sheet-area { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 15px; color: var(--color-text-secondary); }
  .spot-line { display: flex; align-items: center; gap: 10px; }
  .spot-name { font-size: 17px; font-weight: 800; }
  .spot-address { margin-top: 2px; font-size: 14px; color: var(--color-text-secondary); }
  .note-text { font-size: 15px; }
  .sheet-actions { display: flex; align-items: center; gap: 16px; margin-top: auto; }
  .sheet-actions .trip-button { margin-left: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // マップ: 淡い地図に小さなホテルラベルのピン。順位の順に飛行機の点線の航路でつなぎ、選んだピンは赤いラベルで傾く
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const spot = post.spots[1];
  const pins = post.spots.map(s => ({ order: s.order, x: s.mapPosition.x, y: s.mapPosition.y * 0.5 + 6, selected: s === spot }));
  const pt = p => `${(p.x / 100) * 402} ${(p.y / 100) * 768}`;
  const o = [...pins].sort((a, b) => a.order - b.order);
  const flight = `<svg class="flight" viewBox="0 0 402 768" preserveAspectRatio="none" aria-hidden="true">
    <path d="M ${pt(o[0])} Q ${(o[0].x + o[1].x) / 2 * 4.02} ${Math.min(o[0].y, o[1].y) / 100 * 768 - 80} ${pt(o[1])}" fill="none" stroke="#23395B" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M ${pt(o[1])} Q ${(o[1].x + o[2].x) / 2 * 4.02 + 40} ${Math.max(o[1].y, o[2].y) / 100 * 768 + 30} ${pt(o[2])}" fill="none" stroke="#23395B" stroke-width="3" stroke-dasharray="8 7"/></svg>`;
  Mock.mount(Mock.screen({
    className: 'map-screen',
    nav: { title: 'マップ' },
    overlay: `${Mock.mapIllustration(pins).replace('<span class="map-pin', `${flight}<span class="map-pin`)}
      <section class="sheet-panel">
        <span class="grabber"></span>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div><h2 class="sheet-title">${esc(post.title)}</h2>
          <p class="sheet-area">${icon('mappin', { size: 14 })}${esc(post.prefecture)} ${esc(post.city)}</p></div>
        <div class="spot-line">${parts.rank(spot.order)}
          <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
        ${parts.note(spot.recommendation)}
        <div class="sheet-actions">${parts.likeButton(post)}${parts.starButton(post)}
          <span class="trip-button">${esc(data.strings.viewPost)}${icon('chevronRight', { size: 16 })}</span></div>
      </section>`,
  }));
</script>
</body>
</html>
