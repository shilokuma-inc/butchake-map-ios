<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>B-5 昭和の銭湯と看板 — ホーム</title>
<meta name="mock-fonts" content="Yuji Syuku|Rampart One|Zen Kaku Gothic New">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Rampart+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=block">
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<link rel="stylesheet" href="theme.css">
<style>
  .nav-large .nav-large-title { padding: 4px 16px 6px; }
  .bath { position: relative; margin: 6px 16px 0; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-card); }
  .bath svg { display: block; }
  .bath .noren { position: absolute; left: 0; right: 0; top: 0; }
  .bath .noren span { height: 46px; font-size: 20px; }
  .bath p { position: absolute; left: 14px; bottom: 16px; padding: 2px 8px; border-radius: 4px; background: #FFFFFF; font-weight: 700; font-size: 15px; }
  .home { display: flex; flex-direction: column; gap: 20px; padding-top: 22px; }
  .home section { display: flex; flex-direction: column; gap: 12px; }
  .carousel { padding: 0 16px 6px; gap: 12px; }
  .feed { display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script src="theme.js"></script>
<script>
  // ホーム: 看板のロゴ・のれんをくぐると富士山のペンキ絵・木札の見出し・下足札のカード・新着の投稿
  const { data, parts } = Mock;
  const posts = data.posts;
  const byLikes = [...posts].sort((a, b) => b.likeCount - a.likeCount);
  Mock.mount(Mock.screen({
    nav: { large: true, titleHTML: Mock.logo(28) },
    tab: 'home',
    body: `<div class="bath">${Mock.fuji(370, 132)}
        <div class="noren"><span style="--c:#1E6E80">ぶ</span><span style="--c:#A8341F">っ</span><span style="--c:#1E6E80">ち</span><span style="--c:#A8341F">ゃ</span><span style="--c:#1E6E80">け</span></div>
        <p>本音で、ひとっ風呂。</p></div>
      <div class="home">
        <section>${parts.sectionHeader(data.strings.weeklyPicks)}
          <div class="carousel">${posts.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.trending)}
          <div class="carousel">${byLikes.slice(0, 3).map(parts.carouselCard).join('')}</div></section>
        <section>${parts.sectionHeader(data.strings.latestPosts)}
          <div class="feed">${posts.slice(0, 2).map(parts.postCard).join('')}</div></section>
      </div>`,
  }));
</script>
</body>
</html>
