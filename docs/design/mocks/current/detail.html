<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>current — 投稿詳細</title>
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<style>
  .detail { display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 0; }
  .detail-head { display: flex; flex-direction: column; gap: 12px; }
  .detail-title { font-size: 22px; font-weight: 700; line-height: 1.3; }
  .detail-area { display: flex; align-items: center; gap: 4px; color: var(--color-text-secondary); font-size: var(--size-subhead); }
  .detail-meta { display: flex; align-items: center; gap: 16px; }
  .detail-author { flex: 1; }
  .detail-author strong { display: block; font-size: var(--size-subhead); }
  .detail-author span { color: var(--color-text-secondary); font-size: var(--size-caption); }
  .spot-card { display: flex; flex-direction: column; gap: 12px; }
  .spot-photo { display: flex; align-items: center; justify-content: center; height: 140px; border-radius: var(--radius-thumb);
    background: var(--color-badge-category-bg); color: var(--color-accent); }
  .spot-name-row { display: flex; gap: 8px; align-items: flex-start; }
  .spot-name-row .rank { width: 28px; height: 28px; font-size: 16px; }
  .spot-name { font-size: var(--size-body); font-weight: 600; }
  .spot-address { color: var(--color-text-secondary); font-size: var(--size-caption); }
  .comment-label { color: var(--color-accent); font-size: var(--size-caption); font-weight: 600; }
  .comment { margin-top: 4px; font-size: var(--size-body); line-height: 1.45; }
  .open-maps { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
    background: var(--color-badge-author-bg); color: var(--color-primary); font-size: var(--size-subhead); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script>
  // 今のアプリの投稿詳細（PostDetailView.swift）: 見出し・バッジ・作者といいね・スターと、スポットごとのカード
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const category = data.categories[post.category];
  const spotCard = spot => `<article class="card spot-card">
    <div class="spot-photo">${icon(category.icon, { size: 40 })}</div>
    <div class="spot-name-row">${parts.rank(spot.order)}
      <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
    <div><p class="comment-label">${esc(data.strings.honestComment)}</p><p class="comment">${esc(spot.recommendation)}</p></div>
    <span class="open-maps">${icon('map', { size: 17 })}${esc(data.strings.openInMaps)}</span>
  </article>`;
  Mock.mount(Mock.screen({
    nav: { title: post.title, back: true, trailing: ['share'] },
    body: `<div class="detail">
      <div class="detail-head">
        <h1 class="detail-title">${esc(post.title)}</h1>
        <p class="detail-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p>
        <div class="badges">${parts.categoryBadge(post)}${parts.authorBadge(post)}</div>
        <div class="detail-meta"><div class="detail-author"><strong>${esc(post.authorName)}</strong><span>${esc(post.date)}</span></div>
          ${parts.likeButton(post)}${parts.starButton(post)}</div>
      </div>
      ${post.spots.slice(0, 2).map(spotCard).join('')}
    </div>`,
  }));
</script>
</body>
</html>
