<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="mock-size" content="402x874">
<title>current — マップ</title>
<link rel="stylesheet" href="../../template/tokens.css">
<link rel="stylesheet" href="../../template/frame.css">
<style>
  .map-screen .screen-scroll { z-index: 1; pointer-events: none; }
  .map-screen .status-bar, .map-screen .nav-bar { background: rgba(249, 249, 249, .94); }
  .sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 384px; padding: 8px 16px 0; z-index: 5;
    border-radius: 34px 34px 0 0; background: var(--color-bg); box-shadow: 0 -4px 24px rgba(0, 0, 0, .15);
    display: flex; flex-direction: column; gap: 14px; }
  .grabber { align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; }
  .sheet-title { font-size: var(--size-title); font-weight: 700; line-height: 1.3; }
  .sheet-area { display: flex; align-items: center; gap: 4px; margin-top: 6px; color: var(--color-text-secondary); font-size: var(--size-subhead); }
  .spot-name-row { display: flex; gap: 8px; align-items: flex-start; }
  .spot-name { font-weight: 600; }
  .spot-address { color: var(--color-text-secondary); font-size: var(--size-caption); }
  .comment-label { margin-top: 10px; color: var(--color-accent); font-size: var(--size-caption); font-weight: 600; }
  .comment { margin-top: 4px; line-height: 1.45; }
  .sheet-actions { display: flex; align-items: center; gap: 16px; }
  .view-post { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 8px 14px; border-radius: 999px;
    background: var(--color-primary); color: var(--color-on-primary); font-size: var(--size-subhead); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../template/mock-data.js"></script>
<script src="../../template/icons.js"></script>
<script src="../../template/mock.js"></script>
<script>
  // 今のアプリのマップ（PostMapView.swift）: 番号付きのピンと、ピンを選んだときのハーフシート。
  // 地図は実際の地図の画像を使わず、イラストで描く
  const { data, parts, icon, esc } = Mock;
  const post = data.posts[0];
  const spot = post.spots[1];
  const pins = post.spots.map(s => ({ order: s.order, x: s.mapPosition.x, y: s.mapPosition.y * 0.55, selected: s === spot }));
  Mock.mount(Mock.screen({
    className: 'map-screen',
    nav: { title: 'マップ' },
    overlay: `${Mock.mapIllustration(pins)}
      <section class="sheet-panel">
        <span class="grabber"></span>
        <div class="badges">${parts.categoryBadge(post)}</div>
        <div><h2 class="sheet-title">${esc(post.title)}</h2>
          <p class="sheet-area">${icon('mappin', { size: 15 })}${esc(post.prefecture)} ${esc(post.city)}</p></div>
        <article class="card"><div class="spot-name-row">${parts.rank(spot.order)}
          <div><p class="spot-name">${esc(spot.name)}</p><p class="spot-address">${esc(spot.address)}</p></div></div>
          <p class="comment-label">${esc(data.strings.honestComment)}</p><p class="comment">${esc(spot.recommendation)}</p></article>
        <div class="sheet-actions">${parts.likeButton(post)}${parts.starButton(post)}
          <span class="view-post">${esc(data.strings.viewPost)}${icon('chevronRight', { size: 15 })}</span></div>
      </section>`,
  }));
</script>
</body>
</html>
